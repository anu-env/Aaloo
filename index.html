<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>hay aaloo 🌹❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF5F7;
    --blush:#FFE4E9;
    --wine:#7A0C26;
    --wine-deep:#470716;
    --curtain:#B00F34;
    --curtain-dark:#5E081E;
    --rose:#FF4D6D;
    --rose-light:#FF8FA3;
    --deep-rose:#C9184A;
    --red:#E5383B;
    --gold:#FFB3C6;
    --gold-light:#FFD6DE;
    --ink:#521021;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    height:100vh;
    width:100vw;
    overflow:hidden;
    background:var(--cream);
    font-family:'Jost', sans-serif;
    color:var(--ink);
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  /* ============ GATE (blank screen, one button) ============ */
  #gate{
    position:fixed; inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    background:
      radial-gradient(ellipse 700px 420px at 50% 30%, #FF8FA355, transparent 65%),
      radial-gradient(ellipse 500px 500px at 50% 110%, #C9184A44, transparent 60%),
      radial-gradient(circle at 10% 10%, #FFE4E9 0%, transparent 35%),
      radial-gradient(circle at 90% 90%, #FFD6DE 0%, transparent 35%),
      linear-gradient(180deg, #FFF5F7 0%, #FFE4E9 55%, #FFD0DB 100%);
    transition:opacity 0.6s ease 0.9s;
    overflow:hidden;
  }
  #gate.hide{ opacity:0; pointer-events:none; }
  .gate-roses{
    font-size:34px;
    letter-spacing:0.35em;
    margin-left:0.35em;
    animation:gate-float 3s ease-in-out infinite;
    filter:drop-shadow(0 6px 12px rgba(201,24,74,0.35));
  }
  @keyframes gate-float{ 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-8px) scale(1.05);} }
  .gate-sub{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:19px;
    color:var(--deep-rose);
    margin:0;
    letter-spacing:0.04em;
  }

  .gate-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(26px, 7vw, 34px);
    color:#fff;
    background:linear-gradient(135deg, #E5383B 0%, #C9184A 45%, #FF4D6D 100%);
    padding:20px 58px;
    border:2px solid #FFD6DE;
    border-radius:999px;
    letter-spacing:0.02em;
    position:relative;
    overflow:hidden;
    box-shadow:0 14px 36px rgba(201,24,74,0.45), 0 0 0 8px rgba(255,77,109,0.12), 0 0 44px rgba(255,77,109,0.45);
    transition:transform 0.3s ease, box-shadow 0.3s ease;
    animation:gate-pulse 2.2s ease-in-out infinite;
  }
  @keyframes gate-pulse{ 0%,100%{box-shadow:0 14px 36px rgba(201,24,74,0.45), 0 0 0 8px rgba(255,77,109,0.12), 0 0 30px rgba(255,77,109,0.35);} 50%{box-shadow:0 18px 44px rgba(201,24,74,0.55), 0 0 0 12px rgba(255,77,109,0.16), 0 0 60px rgba(255,77,109,0.55);} }
  .gate-btn::after{
    content:'';
    position:absolute; top:0; left:-80%;
    width:55%; height:100%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg);
    animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine{ 0%{left:-80%;} 55%,100%{left:130%;} }
  .gate-btn:hover{ transform:translateY(-3px) scale(1.03); }
  .gate-btn:focus-visible{ outline:3px solid var(--deep-rose); outline-offset:5px; }

  /* ============ CURTAINS ============ */
  .curtain{
    position:fixed; top:0; bottom:0;
    width:52%;
    z-index:25;
    background:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 4px,
        rgba(255,255,255,0.09) 4px, rgba(255,255,255,0.09) 11px,
        rgba(120,5,25,0.25) 11px, rgba(120,5,25,0.25) 20px),
      linear-gradient(180deg, #D8113F 0%, var(--curtain) 30%, var(--curtain-dark) 100%);
    box-shadow: inset -20px 0 40px rgba(0,0,0,0.4);
    transition:transform 1.15s cubic-bezier(.7,0,.2,1);
  }
  .curtain::after{
    content:'🌹 🌹 🌹';
    position:absolute; bottom:26px; left:0; right:0;
    text-align:center; font-size:20px; letter-spacing:0.2em;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    opacity:0.95;
  }
  .curtain.left{ left:0; transform-origin:left; box-shadow: inset -34px 0 55px rgba(0,0,0,0.5); border-right:3px solid #FFD6DE; }
  .curtain.right{ right:0; transform-origin:right; box-shadow: inset 34px 0 55px rgba(0,0,0,0.5); border-left:3px solid #FFD6DE; }
  .curtain .trim{
    position:absolute; top:0; bottom:0; width:12px;
    background:linear-gradient(180deg, #FFF0F3, var(--gold) 40%, var(--deep-rose) 90%);
    box-shadow:0 0 14px rgba(255,211,222,0.8);
  }
  .curtain.left .trim{ right:0; }
  .curtain.right .trim{ left:0; }
  .curtain .tassel{
    position:absolute; top:0; width:100%; height:30px;
    background-image: radial-gradient(circle, #FFD6DE 5px, var(--deep-rose) 6px, transparent 7px);
    background-size:28px 30px;
    background-position:top center;
    opacity:1;
    border-bottom:2px solid rgba(255,214,222,0.7);
  }
  #gate.hide ~ .curtain.left,
  body.opened .curtain.left{ transform:translateX(-102%); }
  #gate.hide ~ .curtain.right,
  body.opened .curtain.right{ transform:translateX(102%); }

  /* ============ STAGE (behind curtains) ============ */
  #stageWrap{
    position:fixed; inset:0;
    z-index:1;
    overflow-y:auto;
    overflow-x:hidden;
    background:
      radial-gradient(ellipse 900px 480px at 50% 0%, rgba(255,77,109,0.28), transparent 62%),
      radial-gradient(circle at 8% 90%, #FFD6DE 0%, transparent 42%),
      radial-gradient(circle at 92% 12%, #FF8FA355 0%, transparent 42%),
      radial-gradient(circle at 88% 88%, #C9184A22 0%, transparent 45%),
      linear-gradient(180deg, #FFF5F7 0%, #FFE4E9 40%, #FFD6DE 100%);
  }
  #stageWrap::before{
    content:'';
    position:fixed; inset:0;
    pointer-events:none; z-index:1;
    background-image:radial-gradient(rgba(201,24,74,0.07) 1.5px, transparent 1.6px);
    background-size:26px 26px;
  }

  #petals{position:absolute; inset:0; pointer-events:none; z-index:2; overflow:hidden;}
  .petal{ position:absolute; top:-40px; }
  #sparkles{position:absolute; inset:0; pointer-events:none; z-index:2; overflow:hidden;}
  .sparkle{position:absolute; color:#FF4D6D; animation:sparkle-tw 2.4s ease-in-out infinite; user-select:none;}
  @keyframes sparkle-tw{ 0%,100%{opacity:0.15; transform:scale(0.7) rotate(0deg);} 50%{opacity:1; transform:scale(1.2) rotate(20deg);} }

  .lights{
    position:relative;
    height:44px;
    margin:0 auto;
    max-width:520px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px;
  }
  .lights::before{
    content:'';
    position:absolute; left:8px; right:8px; top:6px; height:2px;
    background:linear-gradient(90deg, transparent, #C9184A88, transparent);
  }
  .lights span{
    width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, var(--rose) 60%, var(--deep-rose));
    box-shadow:0 0 12px 4px rgba(255,77,109,0.6), 0 0 28px 6px rgba(229,56,59,0.3);
    animation:twinkle 1.8s ease-in-out infinite;
    border:1px solid #ffffffaa;
  }
  .lights span:nth-child(odd){ animation-delay:0.4s; background:radial-gradient(circle at 35% 35%, #fff, #FF8FA3 60%, #E5383B); }
  .lights span:nth-child(3n){ animation-delay:0.8s; }
  @keyframes twinkle{ 0%,100%{opacity:0.45; transform:scale(0.85);} 50%{opacity:1; transform:scale(1.15);} }

  section.stage{
    position:relative;
    z-index:3;
    width:100%;
    max-width:500px;
    margin:0 auto;
    text-align:center;
    padding:18px 18px 70px;
  }
  .garland{
    font-size:22px;
    letter-spacing:0.18em;
    margin:6px 0 0;
    animation:garland-sway 4s ease-in-out infinite;
    filter:drop-shadow(0 4px 8px rgba(201,24,74,0.3));
  }
  @keyframes garland-sway{ 0%,100%{transform:rotate(-2deg);} 50%{transform:rotate(2deg);} }

  .arch-wrap{ position:relative; width:280px; margin:16px auto 10px; }
  .arch-glow{
    position:absolute; inset:-22px;
    border-radius:50%;
    background:conic-gradient(from 0deg, #FF4D6D, #FF8FA3, #FFE4E9, #E5383B, #C9184A, #FF4D6D);
    filter:blur(22px);
    opacity:0.55;
    animation:glow-spin 6s linear infinite;
  }
  @keyframes glow-spin{ to{ transform:rotate(360deg); } }
  .arch{
    position:relative;
    width:260px;
    height:260px;
    margin:0 auto;
    border-radius:50%;
    padding:10px;
    background:conic-gradient(from 0deg, #C9184A, #FF4D6D, #FFD6DE, #E5383B, #FF8FA3, #7A0C26, #C9184A);
    box-shadow:0 20px 50px rgba(122,12,38,0.45), 0 0 0 6px #fff, 0 0 0 9px #FFD6DE, 0 0 44px rgba(255,77,109,0.6);
    animation:arch-breathe 4s ease-in-out infinite;
  }
  @keyframes arch-breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.025);} }
  @keyframes frame-spin{ to{ filter:hue-rotate(0deg); } }
  .arch-inner{
    position:relative;
    width:100%; height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#FFAFCC;
    border:4px solid #fff;
  }
  .arch-inner img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  .arch-inner img.active{ opacity:1; }
  .arch-roses{
    position:absolute; left:0; right:0; bottom:-18px;
    font-size:26px; letter-spacing:0.15em;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.25));
    z-index:2;
  }
  .divider{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:14px auto 6px; color:var(--deep-rose); opacity:0.9;
  }
  .divider::before, .divider::after{
    content:''; height:1.5px; width:90px;
    background:linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  .eyebrow-name{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:22px;
    color:var(--deep-rose);
    margin:8px 0 2px;
    letter-spacing:0.12em;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(46px, 11vw, 66px);
    line-height:0.95;
    margin:0 0 6px;
    background:linear-gradient(180deg, #7A0C26 10%, #C9184A 45%, #FF4D6D 75%, #E5383B 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 6px 16px rgba(201,24,74,0.3));
    animation:title-shimmer 5s ease-in-out infinite;
    background-size:100% 200%;
  }
  @keyframes title-shimmer{ 0%,100%{background-position:50% 0%;} 50%{background-position:50% 90%;} }
  .petname{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(22px, 5.5vw, 28px);
    color:#fff;
    margin:8px auto 26px;
    display:inline-block;
    padding:6px 26px;
    background:linear-gradient(135deg, var(--deep-rose), var(--rose));
    border-radius:999px;
    border:1.5px solid #FFD6DE;
    box-shadow:0 8px 22px rgba(201,24,74,0.4);
  }

  .gift-btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Jost', sans-serif; font-weight:600;
    font-size:16px; letter-spacing:0.06em; text-transform:uppercase; color:#fff;
    background:linear-gradient(135deg, #7A0C26 0%, #C9184A 40%, #FF4D6D 80%, #E5383B 100%);
    padding:17px 42px;
    border-radius:999px;
    border:2px solid #FFD6DE;
    box-shadow:0 12px 30px rgba(201,24,74,0.5), 0 0 24px rgba(255,77,109,0.5);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
    position:relative; overflow:hidden;
    animation:gift-glow 2.4s ease-in-out infinite;
  }
  @keyframes gift-glow{ 0%,100%{box-shadow:0 12px 30px rgba(201,24,74,0.5), 0 0 18px rgba(255,77,109,0.4);} 50%{box-shadow:0 14px 36px rgba(201,24,74,0.6), 0 0 36px rgba(255,77,109,0.65);} }
  .gift-btn::after{
    content:''; position:absolute; top:0; left:-70%;
    width:45%; height:100%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-20deg);
    animation:shine 2.6s ease-in-out infinite;
  }
  .gift-btn:hover{ transform:translateY(-3px) scale(1.03); }
  .gift-btn:active{ transform:translateY(0) scale(0.98); }
  .gift-btn:disabled{ opacity:1; cursor:default; animation:none; }
  .gift-btn:focus-visible{ outline:3px solid var(--deep-rose); outline-offset:3px; }

  .reveal{
    margin-top:0; max-height:0; opacity:0; overflow:hidden;
    transition:max-height 1s ease, opacity 1s ease, margin-top 1s ease;
  }
  .reveal.open{ max-height:1400px; opacity:1; margin-top:26px; }

  .card{
    background:linear-gradient(180deg, #ffffff 0%, #FFF5F7 60%, #FFE4E9 100%);
    backdrop-filter:blur(2px);
    border:2px solid #FF8FA3;
    outline:5px solid #ffffff;
    outline-offset:-2px;
    border-radius:28px;
    padding:30px 22px 22px;
    box-shadow:0 22px 50px rgba(122,12,38,0.28), 0 0 30px rgba(255,77,109,0.25);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'🌹 🌸 🌹 🌸 🌹';
    display:block;
    font-size:18px; letter-spacing:0.2em; margin-bottom:12px;
  }
  .card::after{
    content:'';
    position:absolute; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg, #7A0C26, #FF4D6D, #FFD6DE, #FF4D6D, #7A0C26);
  }
  .message{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(21px, 4.8vw, 25px);
    line-height:1.55; color:var(--wine); margin:0 0 12px;
  }
  .signoff{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:18px; color:var(--deep-rose); margin:0 0 22px;
  }

  .filmstrip-label{
    font-size:12px; font-weight:600; letter-spacing:0.2em; color:var(--deep-rose); text-transform:uppercase;
    margin:0 0 12px;
  }
  .filmstrip{
    display:flex; gap:12px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:6px 4px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .filmstrip::-webkit-scrollbar{ height:6px; }
  .filmstrip::-webkit-scrollbar-thumb{ background:var(--rose); border-radius:6px; }
  .filmstrip img{
    scroll-snap-align:center;
    flex:0 0 auto;
    width:124px; height:154px;
    object-fit:cover;
    border-radius:16px;
    border:3px solid #fff;
    outline:2px solid #FF8FA3;
    box-shadow:0 10px 22px rgba(122,12,38,0.3);
    cursor:pointer;
    transition:transform 0.25s ease;
  }
  .filmstrip img:hover{ transform:translateY(-4px) scale(1.04) rotate(-1deg); }

  .love-note{
    margin-top:16px;
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:17px; color:var(--deep-rose);
  }

  footer{
    margin-top:26px; font-size:13px; color:var(--deep-rose); opacity:0.85; letter-spacing:0.04em;
  }

  #confetti-canvas{ position:fixed; inset:0; z-index:40; pointer-events:none; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-roses">🌹🌹🌹</div>
  <button class="gate-btn" id="gateBtn" type="button">hay aaloo 🌹</button>
  <p class="gate-sub">a little surprise wrapped in roses for you ❤️</p>
</div>

<div class="curtain left"><div class="trim"></div><div class="tassel"></div></div>
<div class="curtain right"><div class="trim"></div><div class="tassel"></div></div>

<canvas id="confetti-canvas"></canvas>

<div id="stageWrap">
  <div id="petals" aria-hidden="true"></div>
  <div id="sparkles" aria-hidden="true"></div>

  <section class="stage">
    <div class="lights" id="lightsRow"></div>
    <div class="garland">🌹❤️🌹❤️🌹</div>

    <div class="arch-wrap">
      <div class="arch-glow"></div>
      <div class="arch">
        <div class="arch-inner" id="photoFrame"></div>
      </div>
      <div class="arch-roses">🌹🌸🌹</div>
    </div>

    <div class="divider">🌹</div>

    <p class="eyebrow-name">✨ Archu ✨</p>
    <h1>Happy Birthday</h1>
    <br>
    <p class="petname">Meri Aaloo 🌹❤️</p>

    <br>
    <button class="gift-btn" id="giftBtn" type="button">🌹 Open your gift 🌹</button>

    <div class="reveal" id="revealBox">
      <div class="card">
        <p class="message" id="messageText"></p>
        <p class="signoff">— from the person who's lucky to have you 🌹</p>
        <p class="filmstrip-label">❤️ Tap a photo ❤️</p>
        <div class="filmstrip" id="filmstrip"></div>
        <p class="love-note">You are loved more than all the roses in the world 🌹✨</p>
      </div>
    </div>

    <footer>made with ❤️ & 🌹, just for you</footer>
  </section>
</div>

/* ============ gate -> curtain open ============ */
const gate = document.getElementById('gate');
const gateBtn = document.getElementById('gateBtn');
gateBtn.addEventListener('click', () => {
  gate.classList.add('hide');
  document.body.classList.add('opened');
});

/* ============ string lights ============ */
const lightsRow = document.getElementById('lightsRow');
for (let i = 0; i < 14; i++){
  const s = document.createElement('span');
  lightsRow.appendChild(s);
}

/* ============ circular frame slideshow ============ */
const frame = document.getElementById('photoFrame');
PHOTOS.forEach((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.alt = 'Archu';
  if (i === 0) img.classList.add('active');
  frame.appendChild(img);
});
let frameIdx = 0;
setInterval(() => {
  const imgs = frame.querySelectorAll('img');
  imgs[frameIdx].classList.remove('active');
  frameIdx = (frameIdx + 1) % imgs.length;
  imgs[frameIdx].classList.add('active');
}, 3200);

/* ============ filmstrip inside reveal card ============ */
const filmstrip = document.getElementById('filmstrip');
PHOTOS.forEach((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.alt = 'Photo ' + (i + 1) + ' of Archu';
  img.addEventListener('click', () => {
    const imgs = frame.querySelectorAll('img');
    imgs.forEach(im => im.classList.remove('active'));
    imgs[i].classList.add('active');
    frameIdx = i;
  });
  filmstrip.appendChild(img);
});

/* ============ birthday message ============ */
const MESSAGE = "Happy Birthday, Meri Aaloo! 🌹 Today is all about you \u2014 my favorite person, my brightest smile, my softest heart. Like a rose, you make every ordinary day beautiful just by being in it. Here's to more laughter, more dreams, and a year as lovely as you are. ❤️";
document.getElementById('messageText').textContent = MESSAGE;

/* ============ reveal + confetti ============ */
const giftBtn = document.getElementById('giftBtn');
const revealBox = document.getElementById('revealBox');
let opened = false;
giftBtn.addEventListener('click', () => {
  if (opened) return;
  opened = true;
  revealBox.classList.add('open');
  giftBtn.textContent = 'Happy Birthday Meri Jaan! 🌹❤️';
  giftBtn.disabled = true;
  fireConfetti();
  setTimeout(() => revealBox.scrollIntoView({behavior:'smooth', block:'center'}), 350);
});

/* ============ confetti ============ */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);
const COLORS = ['#C9184A', '#FF4D6D', '#FF8FA3', '#E5383B', '#FFD6DE', '#7A0C26'];
let particles = [];
function fireConfetti(){
  for (let burst = 0; burst < 2; burst++){
    setTimeout(()=>{
      for (let i = 0; i < 160; i++){
        particles.push({
          x: canvas.width * (0.2 + Math.random()*0.6), y: canvas.height * 0.30,
          vx: (Math.random() - 0.5) * 15, vy: (Math.random() * -15) - 4,
          g: 0.35 + Math.random() * 0.15, size: 5 + Math.random() * 7,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
          life: 0, shape: Math.random() > 0.4 ? 'rect' : 'circle'
        });
      }
    }, burst*350);
  }
}
function tick(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, 1 - p.life / 260);
    if (p.shape === 'rect'){ ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6); }
    else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });
  particles = particles.filter(p => p.life < 260 && p.y < canvas.height + 40);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ============ floating rose petals + sparkles ============ */
const petalLayer = document.getElementById('petals');
const PETAL_COLORS = ['#FF4D6D', '#FF8FA3', '#C9184A', '#E5383B', '#FFD6DE'];
const PETAL_EMOJI = ['🌹', '🌸', '❤️', '💖', '🥀'];
function spawnPetal(){
  // 30% chance: falling emoji rose/heart
  if (Math.random() < 0.32){
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = PETAL_EMOJI[Math.floor(Math.random() * PETAL_EMOJI.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (14 + Math.random() * 16) + 'px';
    const duration = 7 + Math.random() * 7;
    const drift = (Math.random() - 0.5) * 180;
    el.animate([
      { transform: `translate(0, -5vh) rotate(0deg)`, opacity: 0.95 },
      { transform: `translate(${drift}px, 112vh) rotate(${Math.random()*360}deg)`, opacity: 0.2 }
    ], { duration: duration * 1000, easing: 'linear' });
    petalLayer.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
    return;
  }
  const el = document.createElement('div');
  el.className = 'petal';
  const size = 9 + Math.random() * 11;
  el.style.left = Math.random() * 100 + 'vw';
  el.style.width = size + 'px';
  el.style.height = size * 1.2 + 'px';
  el.style.background = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
  el.style.borderRadius = '80% 0 80% 0';
  el.style.boxShadow = '0 2px 6px rgba(201,24,74,0.3)';
  const duration = 9 + Math.random() * 8;
  const drift = (Math.random() - 0.5) * 160;
  el.animate([
    { transform: `translate(0, -5vh) rotate(0deg)`, opacity: 0.9 },
    { transform: `translate(${drift}px, 115vh) rotate(360deg)`, opacity: 0.15 }
  ], { duration: duration * 1000, easing: 'linear' });
  petalLayer.appendChild(el);
  setTimeout(() => el.remove(), duration * 1000);
}
setInterval(spawnPetal, 550);
for (let i = 0; i < 8; i++) setTimeout(spawnPetal, i * 250);

/* twinkling sparkles */
const sparkleLayer = document.getElementById('sparkles');
const SPARKS = ['✨','✦','❤️','🌹','💖'];
function spawnSparkle(){
  const el = document.createElement('div');
  el.className = 'sparkle';
  el.textContent = SPARKS[Math.floor(Math.random()*SPARKS.length)];
  el.style.left = Math.random()*100 + 'vw';
  el.style.top = Math.random()*100 + 'vh';
  el.style.fontSize = (10 + Math.random()*16) + 'px';
  el.style.animationDelay = (Math.random()*2) + 's';
  sparkleLayer.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
setInterval(spawnSparkle, 600);
for (let i=0;i<10;i++) setTimeout(spawnSparkle, i*200);
